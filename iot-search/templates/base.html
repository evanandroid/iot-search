<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}IoT Search{% endblock %} · Mesin Pencari VSM TF-IDF</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="{{ url_for('index') }}">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="2.2"/><path d="M7.8 7.8a6 6 0 0 0 0 8.4M16.2 7.8a6 6 0 0 1 0 8.4M4.9 4.9a10 10 0 0 0 0 14.2M19.1 4.9a10 10 0 0 1 0 14.2"/></svg>
      </span>
      <span>IoT<strong>Search</strong></span>
    </a>
    <nav>
      <a href="{{ url_for('index') }}" class="{{ 'on' if request.endpoint == 'index' }}">Beranda</a>
      <a href="{{ url_for('pipeline') }}" class="{{ 'on' if request.endpoint == 'pipeline' }}">Pra-proses Teks</a>
    </nav>
  </header>

  <main>{% block content %}{% endblock %}</main>

  <footer class="foot">
    Vector Space Model · TF-IDF · Cosine Similarity &nbsp;|&nbsp; {{ '{:,}'.format(1000).replace(',', '.') }} dokumen bertema Internet of Things
  </footer>
</body>
</html>
